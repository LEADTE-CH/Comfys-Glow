services:
  - type: web
    name: comfys-glow-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    disk:
      name: comfys-glow-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
